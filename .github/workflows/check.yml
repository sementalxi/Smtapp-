name: check
on: push
permissions:
  contents: write
jobs:
  check:
    if: "!contains(github.event.head_commit.message, 'ci-results')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: use main's code
        run: git fetch origin main && git checkout origin/main -- src prisma package.json public next.config.ts tsconfig.json postcss.config.mjs 2>/dev/null || git checkout origin/main -- src prisma package.json public
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: typecheck
        run: mkdir -p ci && (npx tsc --noEmit > ci/typecheck.txt 2>&1; echo "exit $?" >> ci/typecheck.txt)
      - name: build
        run: (DATABASE_URL="postgresql://u:p@localhost:5432/db" SESSION_SECRET=ci-check-secret-ci-check-secret-1234 npx next build > ci/build.txt 2>&1; echo "exit $?" >> ci/build.txt); tail -60 ci/build.txt > ci/build-tail.txt
      - name: live pages
        run: |
          exec > ci/live.txt 2>&1
          for p in / /login /register /pricing /dashboard /create /admin /api/banners /api/image-search?q=messi /api/files/db/none; do
            printf "%-28s " "$p"; curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 30 "https://smtapp-ten.vercel.app$p"
          done
          echo "--- POST api checks (expect 401/400)"
          curl -s -X POST -H 'content-type: application/json' -d '{}' https://smtapp-ten.vercel.app/api/ai-text; echo
          curl -s -X POST -H 'content-type: application/json' -d '{}' https://smtapp-ten.vercel.app/api/upload/from-url; echo
      - name: screenshots
        run: |
          npx -y playwright@1.49.1 install --with-deps chromium >/dev/null 2>&1
          cat > shot.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          for (const [name, w, h] of [["mobile", 390, 844], ["desktop", 1366, 900]]) {
            const ctx = await b.newContext({ viewport: { width: w, height: h } });
            await ctx.addCookies([{ name: "kixo_lang_asked", value: "1", url: "https://smtapp-ten.vercel.app" }]);
            const p = await ctx.newPage();
            const errors = [];
            p.on("pageerror", (e) => errors.push(String(e)));
            p.on("console", (m) => m.type() === "error" && errors.push(m.text()));
            for (const path of ["/", "/login", "/register", "/pricing"]) {
              await p.goto("https://smtapp-ten.vercel.app" + path, { waitUntil: "networkidle", timeout: 60000 });
              // scroll like a person so scroll-reveal content appears
              for (let y = 0; y < 12000; y += 500) { await p.evaluate((v) => window.scrollTo(0, v), y); await p.waitForTimeout(120); }
              await p.evaluate(() => window.scrollTo(0, 0));
              await p.waitForTimeout(1500);
              const hidden = await p.evaluate(() => [...document.querySelectorAll("[data-reveal]")].filter((e) => getComputedStyle(e).opacity === "0").length);
              console.log(name, path, "hidden reveal elements:", hidden);
              const safe = path === "/" ? "home" : path.slice(1);
              await p.screenshot({ path: `shots/${name}-${safe}.png`, fullPage: true });
              if (path === "/") { await p.click('button[aria-label="Menu"]'); await p.waitForTimeout(900); await p.screenshot({ path: `shots/${name}-menu.png` }); await p.keyboard.press("Escape"); await p.waitForTimeout(400); }
            }
            console.log(name, "errors:", JSON.stringify(errors));
          }
          await b.close();
          JS
          mkdir -p shots && npm i --no-save playwright@1.49.1 >/dev/null 2>&1 && node shot.mjs > ci/browser.txt 2>&1 || true
      - name: save results
        run: |
          mkdir -p ci/shots && cp shots/*.png ci/shots/ 2>/dev/null || true
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -f ci && git commit -qm "ci-results" && git push
