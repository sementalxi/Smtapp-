name: check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: typecheck
        run: npx tsc --noEmit
        continue-on-error: true
      - name: live pages
        run: |
          for p in / /login /register /pricing /dashboard /create /admin /api/banners /api/image-search?q=messi /api/files/db/none; do
            printf "%-28s " "$p"; curl -s -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 30 "https://smtapp-ten.vercel.app$p"
          done
          echo "--- POST api checks (expect 401/400)"
          curl -s -X POST -H 'content-type: application/json' -d '{}' https://smtapp-ten.vercel.app/api/ai-text; echo
          curl -s -X POST -H 'content-type: application/json' -d '{}' https://smtapp-ten.vercel.app/api/upload/from-url; echo
      - name: screenshots
        run: |
          npx -y playwright@1.49.1 install --with-deps chromium >/dev/null 2>&1
          cat > shot.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          for (const [name, w, h] of [["mobile", 390, 844], ["desktop", 1366, 900]]) {
            const p = await b.newPage({ viewport: { width: w, height: h } });
            const errors = [];
            p.on("pageerror", (e) => errors.push(String(e)));
            p.on("console", (m) => m.type() === "error" && errors.push(m.text()));
            for (const path of ["/", "/login", "/register", "/pricing"]) {
              await p.goto("https://smtapp-ten.vercel.app" + path, { waitUntil: "networkidle", timeout: 60000 });
              await p.waitForTimeout(1500);
              const safe = path === "/" ? "home" : path.slice(1);
              await p.screenshot({ path: `shots/${name}-${safe}.png`, fullPage: true });
            }
            console.log(name, "errors:", JSON.stringify(errors));
          }
          await b.close();
          JS
          mkdir -p shots && npm i --no-save playwright@1.49.1 >/dev/null 2>&1 && node shot.mjs
      - uses: actions/upload-artifact@v4
        with: { name: shots, path: shots }
