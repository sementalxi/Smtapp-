name: Mobile apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npm run assets -- --android
      - run: npx cap sync android
      - name: Upload key (from secrets, or a new one on the first run)
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload.jks
            echo "pass=$KS_PASS" >> "$GITHUB_OUTPUT"
            echo "new=0" >> "$GITHUB_OUTPUT"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore android/app/upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=KIXO, O=KIXO, C=US"
            mkdir -p ../upload-key
            base64 -w0 android/app/upload.jks > ../upload-key/ANDROID_KEYSTORE_BASE64.txt
            echo "$PASS" > ../upload-key/ANDROID_KEYSTORE_PASSWORD.txt
            echo "pass=$PASS" >> "$GITHUB_OUTPUT"
            echo "new=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed AAB + APK
        working-directory: mobile/android
        env:
          PASS: ${{ steps.key.outputs.pass }}
        run: |
          cat >> app/build.gradle <<'GRADLE'
          android {
            signingConfigs { upload { storeFile file("upload.jks"); storePassword System.getenv("PASS"); keyAlias "upload"; keyPassword System.getenv("PASS") } }
            buildTypes { release { signingConfig signingConfigs.upload } }
          }
          GRADLE
          ./gradlew bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: kixo-android
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
      - if: steps.key.outputs.new == '1'
        uses: actions/upload-artifact@v4
        with: { name: android-upload-key, path: upload-key, retention-days: 3 }

  ios:
    runs-on: macos-latest
    permissions: { contents: write }
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx cap add ios
      - run: npm run assets -- --ios
      - run: npx cap sync ios
      - name: Build (unsigned — checks the project compiles)
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - run: tar -czf ../kixo-ios.tgz ios
      # The ready-to-open Xcode project (with its CocoaPods) on the "ios-project" branch, for building on a Mac.
      - name: Publish the Xcode project to the ios-project branch
        working-directory: .
        run: |
          git config user.name "kixo-ci"; git config user.email "ci@kixo.pro"
          git checkout --orphan ios-project
          git rm -rq --cached .
          git add -f mobile/ios mobile/capacitor.config.json mobile/node_modules/@capacitor/ios mobile/node_modules/@capacitor/splash-screen mobile/node_modules/@capacitor/status-bar
          git commit -qm "Xcode project from run ${{ github.run_number }}"
          git push -qf origin ios-project
      - uses: actions/upload-artifact@v4
        with: { name: kixo-ios-project, path: kixo-ios.tgz }
      # Signed build sent straight to App Store Connect (TestFlight), once these repository secrets exist:
      # APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (the .p8 file's text). The key needs the Admin
      # role so Xcode can make the signing certificate and profile itself (cloud signing) — no Mac needed.
      - name: Sign and upload to App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD: ${{ github.run_number }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$KEY_P8" ]; then
            echo "::notice::App Store secrets not set yet — skipping the signed upload."; exit 0
          fi
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"; printf '%s' "$KEY_P8" > "$KEY"
          # No custom encryption (HTTPS only): answers the export-compliance question for every build.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || true
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD" $AUTH archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/out" $AUTH
          rm -f "$KEY"
          echo "::notice::Build $BUILD uploaded — it appears in App Store Connect → TestFlight after Apple processes it."
