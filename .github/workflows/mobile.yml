name: Mobile apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npm run assets -- --android
      - run: npx cap sync android
      - name: Upload key (from secrets, or a new one on the first run)
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload.jks
            echo "pass=$KS_PASS" >> "$GITHUB_OUTPUT"
            echo "new=0" >> "$GITHUB_OUTPUT"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore android/app/upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=KIXO, O=KIXO, C=US"
            mkdir -p ../upload-key
            base64 -w0 android/app/upload.jks > ../upload-key/ANDROID_KEYSTORE_BASE64.txt
            echo "$PASS" > ../upload-key/ANDROID_KEYSTORE_PASSWORD.txt
            echo "pass=$PASS" >> "$GITHUB_OUTPUT"
            echo "new=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed AAB + APK
        working-directory: mobile/android
        env:
          PASS: ${{ steps.key.outputs.pass }}
        run: |
          cat >> app/build.gradle <<'GRADLE'
          android {
            signingConfigs { upload { storeFile file("upload.jks"); storePassword System.getenv("PASS"); keyAlias "upload"; keyPassword System.getenv("PASS") } }
            buildTypes { release { signingConfig signingConfigs.upload } }
          }
          GRADLE
          ./gradlew bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: kixo-android
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk
      - if: steps.key.outputs.new == '1'
        uses: actions/upload-artifact@v4
        with: { name: android-upload-key, path: upload-key, retention-days: 3 }

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx cap add ios
      - run: npm run assets -- --ios
      - run: npx cap sync ios
      - name: Build (unsigned — checks the project compiles)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - run: tar -czf ../kixo-ios.tgz ios
      - uses: actions/upload-artifact@v4
        with: { name: kixo-ios-project, path: kixo-ios.tgz }
